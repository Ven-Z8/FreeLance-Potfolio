[project]
name = "eval-harness"
version = "0.1.0"
description = "Domain-Adaptive Agent Evaluation Harness (Proving Ground) across Finance, Biomedical, Legal, and Healthcare domains."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "instructor>=1.15.0",
    "jinja2>=3.1.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "lxml>=5.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "openai>=1.50.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31.0",
    "sentence-transformers>=3.0.0",
]


[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
eval-harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
