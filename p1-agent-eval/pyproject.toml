[project]
name = "agenteval"
version = "0.1.0"
description = "Domain-Adaptive Agent Evaluation Harness across Finance, Biomedical, Legal, and Healthcare domains."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "instructor>=1.15.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
]


[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
